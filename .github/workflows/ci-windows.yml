name: Windows
on:
  push:
    branches-ignore:
      - '**/sources/**'
      - '**/linux/**'
      - '**/macos/**'
    paths-ignore:
      - '.github/workflows/ci-sources.yml'
      - '.github/workflows/ci-linux.yml'
      - '.github/workflows/ci-macos.yml'
      - '.github/workflows/test-*.yml'
      - 'data/artwork/**'
      - 'data/packaging/linux/**'
      - 'data/packaging/macos/**'
      - 'data/platform/linux/**'
      - 'data/platform/macos/**'
      - 'docs/**'
      - '.clang-format'
      - '.git-blame-ignore-revs'
      - '.git-properties'
      - 'LICENSE'
      - '**/test/*'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.github/workflows/ci-sources.yml'
      - '.github/workflows/ci-linux.yml'
      - '.github/workflows/ci-macos.yml'
      - '.github/workflows/test-*.yml'
      - 'data/artwork/**'
      - 'data/packaging/linux/**'
      - 'data/packaging/macos/**'
      - 'data/platform/linux/**'
      - 'data/platform/macos/**'
      - 'docs/**'
      - '.clang-format'
      - '.git-blame-ignore-revs'
      - '.git-properties'
      - 'LICENSE'
      - '**/test/*'
      - '**.md'

jobs:
  installer:
    name: Installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, sys: ucrt64, arch: x86_64, pkg: ucrt-x86_64 }
          - { os: windows-11-arm, sys: clangarm64, arch: aarch64, pkg: clang-aarch64 }
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-tags: true
        submodules: recursive
    - uses: msys2/setup-msys2@v2.33.0
      with:
        msystem: ${{ matrix.sys }}
        release: false
        update: false
        install: >-
          mingw-w64-${{ matrix.pkg }}-toolchain
          mingw-w64-${{ matrix.pkg }}-cmake
          mingw-w64-${{ matrix.pkg }}-make
          mingw-w64-${{ matrix.pkg }}-wxwidgets3.3-msw
          mingw-w64-${{ matrix.pkg }}-boost
          base-devel
          git
    - name: Configure msys2 environment
      shell: msys2 {0}
      run: |
        git config --global core.autocrlf true
        echo "project_version=`sed -n -E -e "/^project\(wxFormBuilder[[:space:]]+VERSION[[:space:]]+(.*)[[:space:]]+LANGUAGES.*$/{s//-\1/p;q}" CMakeLists.txt `" >> $GITHUB_ENV
    - name: Create build system
      shell: msys2 {0}
      run: |
        cmake -S . -B _build -G "MSYS Makefiles" --install-prefix "$PWD/_install" -DCMAKE_BUILD_TYPE=Release
    - name: Package build system
      if: ${{ contains(github.ref, '/build/') }}
      shell: cmd
      run: |
        7z a -tzip -bb1 wxFormBuilder-Windows-${{ matrix.pkg }}-build.zip _build
    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build _build --config Release -j `nproc`
    - name: Test stage
      shell: msys2 {0}
      run: |
        _build\\stage\\wxFormBuilder.exe -v
        _build\\stage\\wxFormBuilder.exe -g test\\wxfbTest.fbp
    - name: Install
      shell: msys2 {0}
      run: |
        cmake --install _build --config Release --strip
    - name: Verify installed dependencies
      shell: msys2 {0}
      run: |
        # Every DLL referenced by an installed binary must be installed next to the binary or next to
        # the application, or must be provided by the operating system.
        installRoot="$PWD/_install"
        systemDir="`cygpath -u "$SYSTEMROOT"`/System32"
        status=0
        while IFS= read -r -d '' file; do
          fileDir="`dirname "$file"`"
          for dll in `objdump -p "$file" | sed -n -E 's/^[[:space:]]*DLL Name: (.*)$/\1/p'`; do
            if [ -n "`find "$fileDir" "$installRoot" -maxdepth 1 -iname "$dll" -print -quit`" ]; then
              continue
            fi
            case "$dll" in
              api-ms-win-*|ext-ms-*) continue ;;
            esac
            if [ -n "`find "$systemDir" -maxdepth 1 -iname "$dll" -print -quit`" ]; then
              continue
            fi
            echo "::error::${file#$installRoot/} requires $dll, which is neither installed nor provided by the system"
            status=1
          done
        done < <(find "$installRoot" -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
        exit $status
    - name: Test install
      shell: cmd
      run: |
        _install\\wxFormBuilder.exe -v
        _install\\wxFormBuilder.exe -g test\\wxfbTest.fbp
    - name: Create archive
      shell: cmd
      run: |
        cd _install
        7z a -tzip -bb1 "..\\wxFormBuilder${{ env.project_version }}-${{ matrix.pkg }}.zip" .
    - name: Create installer
      shell: cmd
      run: |
        ISCC.exe /DArch=${{ matrix.arch }} /O. data\\packaging\\windows\\wxFormBuilder.iss
    - uses: actions/upload-artifact@v7.0.2
      if: ${{ contains(github.ref, '/build/') }}
      with:
        name: Windows Build Debugging ${{ matrix.pkg }}
        archive: false
        path: |
          wxFormBuilder-*-build.zip
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: Windows Archive ${{ matrix.pkg }}
        archive: false
        path: |
          wxFormBuilder-*.zip
          !wxFormBuilder-*-build.zip
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: Windows Installer ${{ matrix.pkg }}
        archive: false
        path: |
          wxFormBuilder-*.exe
